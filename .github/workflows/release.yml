# Releases the version in package.json when it reaches main without a tag yet.
# `script/release` opens the PR that changes it.
#
# Building runs a lot of third-party code, so it has no write access. The job with
# write access runs none of it: it only commits the result on top of what it tags.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  # to retry a release that failed
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Find the Version to Release
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected version: $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.version.outputs.version
        run: npm ci --ignore-scripts

      - name: Build dist/ Directory
        if: steps.version.outputs.version
        run: npm run package

      - name: Upload dist/ Directory
        if: steps.version.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tags and create the release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download dist/ Directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          major_tag="v${VERSION%%.*}"

          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git switch --detach
          git add --force dist
          git commit --message "Release $tag"
          git tag --annotate "$tag" --message "$tag"
          git tag --force --annotate "$major_tag" --message "Sync $major_tag with $tag"

          git push --atomic --force origin "$tag" "$major_tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
